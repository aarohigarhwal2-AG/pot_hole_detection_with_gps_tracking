<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pothole Geotag Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        .popup-card { text-align: center; }
        .popup-card img { width: 260px; border-radius: 6px; margin-top: 8px; border: 1px solid #ccc; }
        .badge { background: #e53e3e; color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // Initialize Leaflet map
        const map = L.map('map').setView([21.2212, 81.3104], 16);

        // OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Fetch detections from Python backend
        fetch('map_data.json')
            .then(res => res.json())
            .then(data => {
                data.forEach(item => {
                    const marker = L.marker([item.Latitude, item.Longitude]).addTo(map);

                    const popupContent = `
                        <div class="popup-card">
                            <span class="badge">Pothole Detected</span><br>
                            <p style="margin: 6px 0 2px 0;"><b>Confidence:</b> ${(item.Confidence * 100).toFixed(1)}%</p>
                            <small>GPS: ${item.Latitude.toFixed(4)}, ${item.Longitude.toFixed(4)}</small><br>
                            <img src="${item.Image}" alt="Detection">
                        </div>
                    `;

                    marker.bindPopup(popupContent).openPopup();
                });
            })
            .catch(err => console.error("Error loading map data:", err));
    </script>
</body>
</html>
